name: Staging release gate

# Runs the full release gate on every staging head. Promotion to main requires this check.
on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-gate-${{ github.ref }}
  # Never cancel a running staging push gate; superseded PR runs may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  glib-regression:
    name: GLib backport regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GLib development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev pkg-config
          rustup toolchain install 1.99.1 --profile minimal
          rustc --version
          cargo --version
          pkg-config --version
          pkg-config --modversion glib-2.0
          dpkg-query -W libglib2.0-dev pkg-config
      - name: Verify desktop Linux dependency selection
        run: |
          cargo tree --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu -i glib@0.18.5 | tee "$RUNNER_TEMP/glib-tree.txt"
          grep -F "glib v0.18.5 ($GITHUB_WORKSPACE/vendor/glib)" "$RUNNER_TEMP/glib-tree.txt"
      - name: Verify GLib backport and reversed fix
        env:
          GLIB_REGRESSION_LOCKFILE: ${{ runner.temp }}/glib-regression-Cargo.lock
        run: bash patches/glib/test-backport.sh
      - name: Preserve regression dependency lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glib-regression-cargo-lock
          path: ${{ runner.temp }}/glib-regression-Cargo.lock
          if-no-files-found: error

  contracts:
    name: Shared contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:contracts -- --case TD-01

  staging-release-gate:
    name: Staging release gate
    needs: [contracts, glib-regression]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Require all prerequisite jobs to pass
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          GLIB_RESULT: ${{ needs.glib-regression.result }}
        run: |
          test "$CONTRACTS_RESULT" = success
          test "$GLIB_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --target x86_64-pc-windows-msvc
      - name: Prepare checksum-verified Node and npm
        run: |
          npm run prepare:runtime
          echo "$GITHUB_WORKSPACE/apps/desktop/src-tauri/resources/engine" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/apps/desktop/src-tauri/target/build-tools" >> "$GITHUB_PATH"
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Hydrate pinned Pi model data
        run: node vendor/pi/scripts/update-model-catalog-pin.mjs --hydrate-pinned
      - name: Build the uninstrumented release app
        run: npm run build:desktop
      - name: Run Rust tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Test release-smoke preparation guards
        shell: pwsh
        run: ./tests/bootstrap/prepare-release-drivers.ps1 -TestOnly
      - name: Build and qualify per-run release-smoke drivers
        shell: pwsh
        run: ./tests/bootstrap/prepare-release-drivers.ps1
      - name: Run release and embedded desktop gates
        run: |
          # Once defined, the release gate always runs; path detection only decides whether a missing script is an error.
          if node -e "process.exit(require('./package.json').scripts?.['test:release-gate'] ? 0 : 1)"; then
            npm run test:release-gate
            exit 0
          fi
          # UI prototypes under apps/desktop/prototype/ are non-product fixtures, not runtime source.
          if [ -n "$(git ls-files -- apps packages vendor ':!apps/desktop/prototype')" ]; then
            echo "::error::Runtime source exists but package.json has no test:release-gate script (TD-01 creates it; TD-11 and TD-80 extend it)."
            exit 1
          fi
          echo "Runtime E2E N/A: no test:release-gate script and no runtime source under apps/, packages/ or vendor/." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve sanitized release-smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-smoke-diagnostics
          path: |
            apps/desktop/src-tauri/target/bootstrap-smoke/*/diagnostics/result.json
            apps/desktop/src-tauri/target/bootstrap-smoke/*/diagnostics/driver.log
          if-no-files-found: ignore
          retention-days: 7
